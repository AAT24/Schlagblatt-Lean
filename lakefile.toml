name = "schlagblatt"
defaultTargets = ["Schlagblatt"]

# Pin to a Mathlib release; `lean-toolchain` must match this tag's toolchain.
# On first setup, reconcile by copying the toolchain Mathlib pins:
#   lake update mathlib
#   cp .lake/packages/mathlib/lean-toolchain ./lean-toolchain
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "Schlagblatt"
